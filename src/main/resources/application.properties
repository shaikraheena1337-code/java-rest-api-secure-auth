spring.application.name=secure-rest-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_api?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:secure_api_user}
spring.datasource.password=${DB_PASSWORD:change-this-db-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Set APP_JWT_SECRET in the environment to a random secret of at least 32 bytes.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
